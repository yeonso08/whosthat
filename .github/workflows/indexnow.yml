name: IndexNow

# 바뀐 페이지를 Bing·네이버 등에 알린다 — 내용은 scripts/indexnow.mjs 주석.
# "사이트에 반영" 은 Vercel Deploy Hook 이라 GitHub 가 그 끝을 모른다. 그래서
# 배포에 매달지 않고 한 시간마다 라이브 sitemap 을 지난번 것과 비교한다.
# 바뀐 게 없으면 아무것도 안 보낸다.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      # 지난번 sitemap. 캐시는 한 번 쓰면 못 덮어써서 실행마다 새 키로 저장하고,
      # 읽을 때는 접두어로 가장 최근 것을 가져온다. 캐시가 날아가면(7일 미사용)
      # 전 주소를 한 번 다시 보낼 뿐이다.
      - uses: actions/cache/restore@v4
        with:
          path: indexnow-snapshot.json
          key: indexnow-snapshot-${{ github.run_id }}
          restore-keys: indexnow-snapshot-

      - run: node scripts/indexnow.mjs indexnow-snapshot.json

      - uses: actions/cache/save@v4
        with:
          path: indexnow-snapshot.json
          key: indexnow-snapshot-${{ github.run_id }}
