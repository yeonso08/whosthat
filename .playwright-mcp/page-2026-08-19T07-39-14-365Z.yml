    - text: 안녕하세요, 32기 광수입니다.일반인으로서 방송에 출연한다는 것,그리고 제 삶의 이야기를 세상에 알린다는 것에 솔직히 고민과 걱정도 많았습니다.그럼에도 바쁜 진료 일정까지 비워가며 용기를 냈던 이유는 단 하나였습니다.평생을 함께할 소중한 반쪽, 정말 좋은 사람을 만나고 싶다는 진심이었습니다.그리고 그 진심이 닿았는지, 솔로나라에서 평생을 함께 하고 싶은 사랑을 찾았습니다.5박 6일 동안 현실과는 비교할 수 없을 만큼 밀도 높고 특별한 시간을 보냈고, 무엇보다 소중한 인연의 동기들까지 얻게 되어 더없이 감사한 마음입니다.그동안 따뜻한 시선으로 응원해 주시고 격려해 주신 모든 분들께 진심으로 감사드립니다.앞으로 제 자리에서, 예쁜 사랑 키워가며 더욱 성숙한 모습으로 살아가겠습니다.감사합니다.
